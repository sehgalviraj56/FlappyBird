name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            ccache \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 \
            libncursesw6 \
            libtinfo6 \
            cmake \
            libltdl-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Upgrade Pip & Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip "setuptools<60.0.0" wheel
          pip install --upgrade "cython<3.0.0"
          pip install --upgrade buildozer

      - name: Auto-generate buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = FlappyBird3D
          package.name = flappybird3d
          package.domain = com.thespookyravager
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav,json
          version = 0.1
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 1
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird3D-APK
          path: bin/*.apk
          
