name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Setup JAVA_HOME & Ccache
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      # Global Ccache directory for compiled C/C++ recipes
      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ runner.os }}-

      # Cache Android SDK/NDK to bypass downloading 1.5GB+ every time
      - name: Cache Buildozer Global Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v1-${{ runner.os }}
          restore-keys: |
            buildozer-global-v1-${{ runner.os }}

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Configure buildozer.spec
        run: |
          sed -i "s/^title = .*/title = Flappy Bird/" buildozer.spec
          sed -i "s|^#\?icon.filename = .*|icon.filename = %(source.dir)s/IMG_20260730_164421.jpg|" buildozer.spec

      - name: Build Android APK (Debug)
        run: yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Debug-APK
          path: bin/*.apk
          retention-days: 7
          
