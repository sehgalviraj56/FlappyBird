name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk build-essential libssl-dev libffi-dev python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev
        pip install cython==0.29.33 buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3/' buildozer.spec
        sed -i 's/title = My Application/title = Flappy Bird/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = flappybird/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
        sed -i 's/orientation = portrait/orientation = portrait/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: FlappyBird-APK
        path: bin/*.apk
        
