name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential libssl-dev libffi-dev python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev ccache zip unzip
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer

      - name: Prepare Project and Spec
        run: |
          if [ -f "flappybird.py" ]; then mv flappybird.py main.py; fi
          buildozer init
          
          # Spec Configuration for Pygame / Kivy compatibility
          sed -i 's/title = My Application/title = Flappy Bird/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = flappybird/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.spooky.flappy/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/' buildozer.spec
          sed -i 's/orientation = portrait/orientation = portrait/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/# p4a.branch = master/p4a.branch = develop/' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: bin/*.apk
          
